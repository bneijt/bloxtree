[package]
name = "bloxtree-fuse"
version.workspace = true
edition.workspace = true
description = "FUSE driver — mount a bloxtree and browse latest versions per path"

[dependencies]
bloxtree-core = { path = "../bloxtree-core" }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
fuser = "0.18.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
