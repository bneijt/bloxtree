[package]
name = "bloxtree-core"
version.workspace = true
edition.workspace = true
description = "Content-addressable storage with versioning — core library"

[dependencies]
blake3 = "1"
chrono = "0.4.45"
tempfile = "3"
thiserror = "2.0.19"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
turso = "0.7"
uuid = { version = "1", features = ["v7"] }
